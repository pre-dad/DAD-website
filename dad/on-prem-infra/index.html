:root{
  --ink:#0E1E1E;--ink2:#0A1616;--ink3:#142A2A;--paper:#F8F9FA;
  --red:#FF4A22;--red-hi:#FF6A45;--gold:#FFB800;--cyan:#00D4FF;--teal:#007A7A;
  --mut:#8FA3A3;--dkmut:#B9C6C6;--line:rgba(248,249,250,.09);--line2:rgba(248,249,250,.16);
  --glass:rgba(10,22,22,.72);
  --f-disp:"Space Grotesk","Inter",system-ui,sans-serif;--f-sans:"Inter",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink2);color:var(--paper);font-family:var(--f-sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.panel{position:fixed;background:var(--glass);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
/* parts list */
#parts{left:16px;top:16px;bottom:16px;width:310px;display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.brand svg{height:22px;color:var(--paper);display:block}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:-.03em;line-height:1.05;margin:14px 0 4px}
.brand p{margin:0;font-size:12.5px;color:var(--mut);line-height:1.45}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(255,74,34,.08);border:1px solid rgba(255,74,34,.22)}
.total span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dkmut)}
.total b{font-family:var(--f-disp);font-size:19px;color:var(--red-hi);letter-spacing:-.02em}
body:not(.costs) .cost{display:none!important}
body.costs .nocost{display:none!important}
#list{flex:1;overflow-y:auto;padding:8px 10px 14px;scrollbar-width:thin;scrollbar-color:var(--ink3) transparent}
.cat{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);margin:14px 10px 6px}
.item{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:11px;padding:9px 10px;cursor:pointer;transition:background .25s,border-color .25s}
.item:hover{background:rgba(248,249,250,.05)}
.item.on{background:rgba(255,74,34,.1);border-color:rgba(255,74,34,.4)}
.item i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.item .n{font-size:13.5px;font-weight:500;line-height:1.25}
.item .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.item .q{font-size:11.5px;color:var(--dkmut);font-variant-numeric:tabular-nums;white-space:nowrap}
/* spec module */
#spec{right:16px;top:16px;bottom:16px;width:380px;display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 40px));opacity:0;transition:transform .7s var(--ease),opacity .5s}
#spec.open{transform:none;opacity:1}
.sp-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);position:relative}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dkmut)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.sp-head h2{font-family:var(--f-disp);font-weight:700;font-size:25px;letter-spacing:-.03em;line-height:1.05;margin:10px 40px 6px 0}
.sp-head .model{font-size:12.5px;color:var(--mut)}
#close{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--paper);font-size:18px;cursor:pointer;line-height:1}
#close:hover{border-color:var(--red);color:var(--red-hi)}
.sp-body{flex:1;overflow-y:auto;padding:16px 22px 22px;scrollbar-width:thin;scrollbar-color:var(--ink3) transparent}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:10px 12px;border-radius:10px;background:rgba(248,249,250,.035);border:1px solid var(--line)}
.kpi span{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.kpi b{display:block;font-family:var(--f-disp);font-size:18px;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi.hot b{color:var(--red-hi)}
.note{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:12.5px;line-height:1.5;background:rgba(255,184,0,.07);border:1px solid rgba(255,184,0,.28);color:#FFE3A1}
.note.flag{background:rgba(255,74,34,.08);border-color:rgba(255,74,34,.32);color:#FFC9BA}
.note b{color:var(--gold)}
.note.flag b{color:var(--red-hi)}
h3{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:20px 0 8px}
table{width:100%;border-collapse:collapse;font-size:12.8px}
td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}
td:first-child{color:var(--mut);width:42%;padding-right:12px}
.src{display:inline-block;margin-top:16px;font-size:12.5px;color:var(--cyan);text-decoration:none;border-bottom:1px solid rgba(0,212,255,.35)}
.place{font-size:12.5px;color:var(--dkmut);line-height:1.5}
/* toolbar */
#bar{left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
#bar button{font:500 12.5px var(--f-sans);color:var(--dkmut);background:transparent;border:0;border-radius:999px;padding:9px 14px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
#bar button:hover{color:var(--paper);background:rgba(248,249,250,.06)}
#bar button.on{color:var(--paper);background:rgba(255,74,34,.18)}
#tip{position:fixed;pointer-events:none;padding:6px 10px;border-radius:8px;background:rgba(10,22,22,.9);border:1px solid var(--line2);font-size:12px;white-space:nowrap;transform:translate(14px,14px);opacity:0;transition:opacity .15s;z-index:5}
#hint{position:fixed;top:22px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);pointer-events:none;transition:opacity .6s;white-space:nowrap}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink2);z-index:10;transition:opacity .9s}
#load div{width:160px;height:2px;background:var(--ink3);overflow:hidden;border-radius:2px}
#load div::after{content:"";display:block;height:100%;width:40%;background:var(--red);animation:ld 1.1s var(--ease) infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@media (max-width:860px){
  #parts{left:0;right:0;top:auto;bottom:0;width:auto;height:38svh;border-radius:18px 18px 0 0}
  .brand{padding:14px 16px 10px}.brand h1{font-size:18px;margin:8px 0 2px}.brand p{display:none}.total{margin-top:8px;padding:7px 10px}
  #spec{left:0;right:0;top:auto;bottom:0;width:auto;height:62svh;border-radius:18px 18px 0 0;transform:translateY(105%);z-index:3}
  #spec.open{transform:none}
  #bar{top:12px;bottom:auto}
  #bar button{padding:8px 10px;font-size:12px}
  #hint{display:none}
}
</style>
</head>

<canvas id="c" tabindex="0" aria-label="3D model of the DAD on-prem AI rack"></canvas>
<div id="load"><div></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PARTS = [

  { key:'switch', cat:'Network', c:'#00D4FF', name:'UniFi Pro XG 24 PoE', type:'Switch, 10G (PoE+++, RJ45, SFP+)', unit:1982, qty:1, size:'1U', place:'U41', link:'https://store.ui.com/us/en/category/switching-professional-max-xg/products/usw-pro-xg-24-poe' },
  { key:'rj45', cat:'Network', c:'#00D4FF', name:'RJ45 patch cables', type:'Cable', unit:12, qty:40, size:'0U', place:'Front patching runs through the left cable channel; the rest run at the rear', link:null },
  { key:'nas', cat:'Storage', c:'#FFB800', name:'UniFi NAS Pro 8', type:'NAS, 10G', unit:880, qty:2, size:'2U', place:'NAS A · U27–28 · NAS B · U25–26', link:'https://store.ui.com/us/en/category/network-storage/products/unas-pro-8' },
  { key:'hdd', cat:'Storage', c:'#FFB800', name:'Enterprise 3.5" HDD, 16 TB', type:'HDD', unit:699, qty:16, size:'0U', place:'8 per NAS (16 bays across both)', comment:"IMPORTANT: We mustn't buy all drives from the same brand. At least 4 different brands and models with the same specs.", link:'https://store.ui.com/us/en/category/accessories-storage/collections/unifi-accessory-tech-hdd/products/uacc-hdd-e-16tb?variant=uacc-hdd-e-16tb' },
  { key:'nvme', cat:'Storage', c:'#FFB800', name:'Lexar NM790 NVMe, 2 TB', type:'SSD', unit:340, qty:4, size:'0U', place:'2 per NAS, inside the chassis', comment:'Meant for storage caching', link:'https://www.lexar.com/global/products/Lexar-NM790-M-2-2280-PCIe-Gen-4x4-NVMe-SSD/' },
  { key:'dgx', cat:'Compute', c:'#76B900', name:'DGX workstation', type:'GPU', unit:100000, qty:1, size:'Tower', place:'Stands on the rack floor in the U1–U14 bay (584 mm tall)', comment:'Supplier TBD · Cost TBD', link:null },
  { key:'cpu', cat:'Compute', c:'#76B900', name:'CPU compute system', type:'CPU Compute', unit:10000, qty:1, size:'2U (assumed)', place:'U21–22', comment:'Model TBD. Shown as a generic 2U server.', link:null },
  { key:'hsm', cat:'Security', c:'#FF4A22', name:'YubiHSM 2 v2.4', type:'HSM', unit:650, qty:2, size:'0U', place:'Plugged into the front USB ports of the CPU compute server', link:'https://www.yubico.com/sg/product/yubihsm-2/' },
  { key:'ups', cat:'Power', c:'#FF6A45', name:'UniFi UPS 2U Pro', type:'UPS', unit:748, qty:2, size:'2U', place:'UPS B · U17–18 · UPS A · U15–16 (heaviest gear low, 32 kg each)', comment:'Two for redundancy; graceful shutdown', link:'https://store.ui.com/us/en/category/integrations-power-tech/products/ups-2u-pro-us' },
  { key:'pdu', cat:'Power', c:'#FF6A45', name:'UniFi Power Distribution Pro', type:'PDU', unit:307, qty:2, size:'2U', place:'PDU A · U37–38 · PDU B · U35–36', comment:'Two for redundancy', link:'https://store.ui.com/us/en/category/integrations-power-tech/collections/unifi-power-tech-power-distribution/products/usp-pdu-pro' },
  { key:'rack', cat:'Rack & mounting', c:'#B9C6C6', name:'UniFi 42U Rack Cabinet (glass front)', type:'Rack', unit:990, qty:1, size:'42U', place:'The cabinet itself', link:'https://store.ui.com/us/en/category/accessories-rack-mount/collections/42u-rack-cabinets/products/uacc-rack-42u-800-g' },
  { key:'rails', cat:'Rack & mounting', c:'#B9C6C6', name:'Rack rail pair', type:'Rack', unit:79, qty:14, size:'0U', place:'Sliding rails under the gateway, switch, NAS, UPS and CPU server', link:'https://store.ui.com/us/en/products/uacc-rack-rails-slide' },
  { key:'ocd', cat:'Rack & mounting', c:'#B9C6C6', name:'Rack Mount OCD Panels', type:'Rack', unit:29, qty:32, size:'2U', place:'Six 2U blanks fill the empty space: U19, U23, U29, U31, U33, U39', comment:'One for every empty 2U + PDUs', link:'https://store.ui.com/us/en/category/accessories-rack-mount/products/uacc-rack-panel-ocd?variant=uacc-rack-panel-blank-2u' },
];
const PK = Object.fromEntries(PARTS.map(p => [p.key, p]));
const usd = n => '$' + n.toLocaleString('en-US');
const SPECS = window.RACK_SPECS || {};
if (SPECS.dgx && SPECS.dgx.name) PK.dgx.shown = SPECS.dgx.name;

/* =====================================================================
   Renderer / scene
   ===================================================================== */
await Promise.all(['700 20px "Space Grotesk"', '400 20px Inter', '500 20px Inter', '600 20px Inter'].map(f => document.fonts.load(f)));

const canvas = document.getElementById('c');
const mobile = matchMedia('(max-width:860px)').matches;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const BG = 0x061010;
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 7, 18);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.02, 60);
const HOME = { pos: new THREE.Vector3(2.05, 1.55, 2.75), target: new THREE.Vector3(0, 1.0, 0) };
camera.position.set(4.6, 2.6, 6.2);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 0.35;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.53;
controls.autoRotateSpeed = 0.6;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const hideForAO = [];   // see-through things (glass) that must not cast AO
let gtao = null;
if (!mobile) {
  gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
  gtao.blendIntensity = 0.85;
  gtao.updateGtaoMaterial({ radius: 0.09, distanceExponent: 1.4, thickness: 1, scale: 1.1, samples: 16 });
  gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
  const render0 = gtao.render.bind(gtao);
  gtao.render = (...a) => { hideForAO.forEach(o => o.visible = false); render0(...a); hideForAO.forEach(o => o.visible = true); };
  composer.addPass(gtao);
}
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.45, 1.6);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* lights */
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x0b1414, 0.35);
scene.add(hemi);
const key = new THREE.SpotLight(0xfff3e6, 26, 14, Math.PI / 6.5, 0.55, 1.6);
key.position.set(2.8, 4.6, 3.6);
key.target.position.set(0, 0.9, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key, key.target);
const rimO = new THREE.DirectionalLight(0xdfe8ff, 0.55); rimO.position.set(-3, 2.4, -2.5); scene.add(rimO);
const rimC = new THREE.DirectionalLight(0xffffff, 0.45); rimC.position.set(3.2, 1.6, -3); scene.add(rimC);
RectAreaLightUniformsLib.init();
const panel = new THREE.RectAreaLight(0xf4f8ff, 5, 1.4, 0.5);   // overhead LED panel
panel.position.set(0, 2.95, 1.1); panel.lookAt(0, 0.9, 0.2); scene.add(panel);
{ const lp = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.5), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xf4f8ff).multiplyScalar(1.4), toneMapped: false }));
  lp.position.copy(panel.position); lp.quaternion.copy(panel.quaternion); lp.rotateY(Math.PI); scene.add(lp); }
const fill = new THREE.DirectionalLight(0xbfd8ff, 0.25); fill.position.set(-2.5, 1.5, 3); scene.add(fill);

/* =====================================================================
   Canvas texture helpers (all drawing in millimetres)
   ===================================================================== */
const PXMM = 3.4;
function tex(cv, srgb = true) {
  const t = new THREE.CanvasTexture(cv);
  t.anisotropy = ANISO;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function makeCanvas(wmm, hmm, s = PXMM) {
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(wmm * s); cv.height = Math.ceil(hmm * s);
  const c = cv.getContext('2d'); c.scale(s, s);
  return { cv, c };
}
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

function alu(c, w, h, tone = [208, 212, 214], grain = 0.035) {
  const g = c.createLinearGradient(0, 0, 0, h);

const TRAY = { y: 2.45, z: 0.24 };
const U = 0.04445, BASE = 0.115, FZ = 0.28, PW = 0.4826, BW = 0.442;
const RW = 0.6, RD = 0.8, RTOP = BASE + 42 * U + 0.07;
const uY = u => BASE + (u - 1) * U;   // bottom of U slot

const pickables = [];
const groupsByKey = {};      // key -> [objects that pull]
function reg(key, obj) { (groupsByKey[key] ||= []).push(obj); obj.traverse(o => { o.userData.key ||= key; if (o.isMesh) { pickables.push(o); o.castShadow = true; o.receiveShadow = true; } }); }

/* a front panel: draws map + emissive canvases, returns material + LED list */
function facePanel(wmm, hmm, draw) {
  const A = makeCanvas(wmm, hmm), E = makeCanvas(wmm, hmm);
  E.c.fillStyle = '#000'; E.c.fillRect(0, 0, wmm, hmm);
  const list = [], ports = {};
  const api = {

    led(x, y, w, h, color, mode = 'on', f = 1) { list.push({ x, y, w, h, color, mode, f }); A.c.fillStyle = 'rgba(20,24,26,.9)'; A.c.fillRect(x, y, w, h); },
    port(name, x, y) { ports[name] = { x, y }; },
  };
  draw(api);
  const map = tex(A.cv), emi = tex(E.cv);
  const mat = new THREE.MeshStandardMaterial({ map, emissiveMap: emi, emissive: 0xffffff, emissiveIntensity: 1.5, metalness: .55, roughness: .4 });

function addLeds(parent, fp, zOff = 0.0004) {
  for (const L of fp.list) {
    const m = new THREE.Mesh(ledGeom(L.w / 1000, L.h / 1000), ledMat(L.color, L.k || 4.5));
    m.position.set((L.x + L.w / 2 - fp.wmm / 2) / 1000, (fp.hmm / 2 - L.y - L.h / 2) / 1000, zOff);
    m.userData.noShadow = true;
    parent.add(m);
    if (L.mode !== 'on') leds.push({ m, mode: L.mode, f: L.f * (0.6 + rnd() * 1.4), p: rnd() * 100 });
  }
}

/* rack-mounted device on sliding rails */
const devices = [];
function rackDevice({ key, id, u, n, depth = 0.42, draw, pull = 0.32, plateMat }) {
  const H = n * U - 0.0014;
  const g = new THREE.Group();
  g.position.set(0, uY(u) + n * U / 2, FZ);
  const fp = facePanel(PW * 1000, H * 1000, draw);
  if (plateMat) Object.assign(fp.mat, plateMat);
  const plate = new THREE.Mesh(new THREE.BoxGeometry(PW, H, 0.004), [M.body, M.body, M.body, M.body, fp.mat, M.body]);
  plate.position.z = -0.002; g.add(plate);
  const body = new THREE.Mesh(new THREE.BoxGeometry(BW, H - 0.002, depth), M.body);
  body.position.z = -0.004 - depth / 2; g.add(body);
  // inner slide rails ride with the device
  const inner = [];
  for (const s of [-1, 1]) {
    const r = new THREE.Mesh(new THREE.BoxGeometry(0.006, Math.min(0.02, H * .45), depth * .96), M.zinc.clone());
    r.position.set(s * (BW / 2 + 0.003), 0, -0.004 - depth / 2); g.add(r); inner.push(r);
    // outer rail fixed to posts
    const o = new THREE.Mesh(new THREE.BoxGeometry(0.004, Math.min(0.026, H * .55), 0.6), M.zinc.clone());
    o.position.set(s * (BW / 2 + 0.0085), uY(u) + n * U / 2, FZ - 0.305); rack.add(o); inner.push(o);
    reg('rails', o);
  }
  addLeds(g, fp);
  rack.add(g);
  const d = { key, id, g, fp, base: FZ, pull, cur: 0, tgt: 0, rails: inner, depth, H };
  devices.push(d);
  reg(key, g);
  for (const r of inner) r.traverse(o => o.userData.key = 'rails');
  return d;
}

  outline.clear();
  if (key && !['rack', 'rj45', 'rails'].includes(key)) {
    const targets = key === 'hdd' ? sleds.map(s => s.s) : key === 'nvme' ? m2s.map(s => s.m) : key === 'hsm' ? hsms.map(h => h.g) : pull.map(d => d.g);
    for (const t of targets) {
      const bb = new THREE.Box3().setFromObject(t, true);
      const size = bb.getSize(new THREE.Vector3()).addScalar(0.006);
      const ln = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(size.x, size.y, size.z)), outMat);
      ln.userData.follow = t; ln.userData.off = bb.getCenter(new THREE.Vector3()).sub(t.getWorldPosition(new THREE.Vector3()));
      outline.add(ln);
    }
  }
  if (key) {
    renderSpec(key);
    specEl.classList.add('open');
    const b = focusBox(key);
    const ctr = b.getCenter(new THREE.Vector3()), size = b.getSize(new THREE.Vector3());
    const r = Math.max(size.x, size.y * 1.15, size.z * .6);
    const dist = (key === 'rack' ? 4.2 : Math.max(0.6, r * 2.5 + 0.3)) * (mobile ? 1.7 : 1);
    const dir = key === 'rack' ? new THREE.Vector3(.55, .3, 1).normalize() : new THREE.Vector3(.62, .38, 1).normalize();
    flyTo(ctr.clone().addScaledVector(dir, dist), ctr);
  } else {
    specEl.classList.remove('open');
    flyTo(HOME.pos, HOME.target);
  }
  hideHint();
}
const btnDoor = document.getElementById('b-door');
function syncDoorBtn() { btnDoor.textContent = door.tgt ? 'Close door' : 'Open door'; btnDoor.classList.toggle('on', !!door.tgt); }
btnDoor.onclick = () => { door.tgt = door.tgt ? 0 : 1; doorByUser = !!door.tgt; syncDoorBtn(); };
document.getElementById('b-reset').onclick = () => { doorByUser = false; select(null); };
let roomOn = true;
const btnRoom = document.getElementById('b-room');
btnRoom.onclick = () => { roomOn = !roomOn; btnRoom.textContent = roomOn ? 'Room lights off' : 'Room lights on'; btnRoom.classList.toggle('on', !roomOn); };
const btnCost = document.getElementById('b-cost');
const setCosts = on => { document.body.classList.toggle('costs', on); btnCost.classList.toggle('on', on); btnCost.textContent = on ? 'Hide costs' : 'Show costs'; };
btnCost.onclick = () => setCosts(!document.body.classList.contains('costs'));
setCosts(new URLSearchParams(location.search).has('costs'));
const btnSpin = document.getElementById('b-spin');
btnSpin.onclick = () => { controls.autoRotate = !controls.autoRotate; btnSpin.classList.toggle('on', controls.autoRotate); };
addEventListener('keydown', e => { if (e.key === 'Escape') select(null); });

/* hover + picking */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const tip = document.getElementById('tip');
function pick(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickables, false);
  for (const h of hits) {
    if (!h.object.visible) continue;
    let k = h.object.userData.key;
    if (k === 'rack' && door.cur < 0.5 && hits.length > 1) {
      // looking through the closed glass: prefer what's behind it
      const behind = hits.find(x => x.object.userData.key !== 'rack' && x.object.visible);
      if (behind && behind.distance - h.distance < 0.25) k = behind.object.userData.key;
    }
    return k;
  }
  return null;
}
function hover(k) {
  hov = k;
  document.querySelectorAll('.item').forEach(b => b.style.borderColor = (b.dataset.key === k && k !== sel) ? 'var(--line2)' : '');
}
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; hideHint(); });
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || down) { tip.style.opacity = 0; return; }
  const k = pick(e);
  canvas.style.cursor = k ? 'pointer' : 'grab';
  if (k) { tip.textContent = PK[k].name; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.style.opacity = 1; } else tip.style.opacity = 0;
  hover(k);
});
canvas.addEventListener('pointerleave', () => { tip.style.opacity = 0; hover(null); });
canvas.addEventListener('pointerup', e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 5) { const k = pick(e); if (k) select(k === sel ? null : k); }
  down = null;
});
controls.addEventListener('start', () => { camAnim.t = 1; });
let hintGone = false;
function hideHint() { if (hintGone) return; hintGone = true; document.getElementById('hint').style.opacity = 0; }

addEventListener('resize', () => {
  if (gtao) gtao.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; lastShift = -999; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* =====================================================================
   Loop
   ===================================================================== */
const clock = new THREE.Clock();
let shift = 0, lastShift = 1, shiftY = 0, lastShiftY = 0;
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
flyTo(HOME.pos, HOME.target, 2.6);
document.getElementById('load').style.opacity = 0;
setTimeout(() => document.getElementById('load').remove(), 1000);

renderer.setAnimationLoop(() => {
  const clockDt = clock.getDelta(), dt = Math.min(clockDt, 0.05), t = clock.elapsedTime;
  let moved = false;
  for (const d of devices) {
    const n = damp(d.cur, d.tgt, 5, dt);
    if (Math.abs(n - d.cur) > 1e-5) { d.cur = n; d.g.position.z = d.base + d.cur * d.pull; moved = true; }
  }
  for (const s of sleds) {
    const want = s.tgt && s.nas.cur > .6 ? 1 : 0;
    if (t > 0 && want !== s.want) { s.want = want; s.at = t + (want ? s.delay : 0); }
    if (t >= (s.at || 0)) s.cur = damp(s.cur, s.want || 0, 6, dt);
    s.s.position.z = s.base + s.cur * 0.12;
  }
  for (const s of m2s) {
    const want = s.tgt && s.nas.cur > .7 ? 1 : 0;
    s.cur = damp(s.cur, want, 4, dt);
    s.m.visible = s.cur > 0.01;
    // slide out of the rear M.2 slot and float in front of the NAS face, label up
    s.m.position.set(-0.075 + s.k * 0.15, s.cur * 0.012, -0.44 + s.cur * 0.56);
    s.m.rotation.set(s.cur * 0.55, s.cur * Math.sin(t * 0.8 + s.k * 2) * 0.35, 0);
    s.m.scale.setScalar(1 + s.cur * 0.7);
  }
  for (const h of hsms) { h.cur = damp(h.cur, h.tgt, 5, dt); h.g.position.z = h.cur * 0.03; h.g.scale.setScalar(1 + h.cur * 1.2); }
  if (moved) for (const c of cables) buildCable(c);
  door.cur = damp(door.cur, door.tgt, 3.2, dt);
  door.hinge.rotation.y = -door.cur * 1.75;

  // highlight effects
  const pulse = .5 + .5 * Math.sin(t * 3.2);
  outMat.opacity = .45 + .55 * pulse;
  for (const ln of outline.children) { const f = ln.userData.follow; f.getWorldPosition(ln.position).add(ln.userData.off); }
  for (const c of cables) c.mat.emissiveIntensity = damp(c.mat.emissiveIntensity, (sel === 'rj45' ? .6 + pulse * .9 : hov === 'rj45' ? .4 : 0), 6, dt);
  for (const d of devices) if (d.rails) for (const r of d.rails) {
    r.material.emissive ??= new THREE.Color();
    r.material.emissive.set('#FF4A22');
    r.material.emissiveIntensity = damp(r.material.emissiveIntensity || 0, sel === 'rails' ? .5 + pulse * 1.2 : hov === 'rails' ? .4 : 0, 6, dt);
  }

  // LEDs
  for (const L of leds) {
    if (L.mode === 'act') L.m.visible = Math.sin(t * L.f * 6 + L.p) + 0.7 * Math.sin(t * L.f * 13.7 + L.p * 2.3) > -0.35;
    else if (L.mode === 'breathe') { const k = .35 + .65 * (.5 + .5 * Math.sin(t * L.f * 3 + L.p)); L.m.scale.setScalar(.75 + k * .25); L.m.visible = k > .4; }
  }

  // room lights
  const room = roomOn ? 1 : 0;
  hemi.intensity = damp(hemi.intensity, room ? .35 : .03, 3, dt);
  key.intensity = damp(key.intensity, room ? 26 : 2.5, 3, dt);
  fill.intensity = damp(fill.intensity, room ? .25 : 0, 3, dt);
  scene.environmentIntensity = damp(scene.environmentIntensity, room ? .55 : .1, 3, dt);
  bloom.strength = damp(bloom.strength, room ? .7 : 1.1, 3, dt);

  // camera fly
  if (camAnim.t < 1) {
    camAnim.t = Math.min(1, camAnim.t + Math.min(clockDt, 0.1) / camAnim.dur);
    const k = ease(camAnim.t);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, k);
    controls.target.lerpVectors(camAnim.t0, camAnim.t1, k);
  }
  const open = specEl.classList.contains('open');
  const wantShift = mobile ? 0 : (326 - (open ? 396 : 0)) / 2;
  const wantShiftY = mobile ? innerHeight * (open ? 0.31 : 0.19) : 0;
  shift = damp(shift, wantShift, 4, dt); shiftY = damp(shiftY, wantShiftY, 4, dt);
  if (Math.abs(shift - lastShift) + Math.abs(shiftY - lastShiftY) > 0.05) { camera.setViewOffset(innerWidth, innerHeight, -shift, shiftY, innerWidth, innerHeight); lastShift = shift; lastShiftY = shiftY; }
  controls.update();
  composer.render();
});
window.__rack = { select, PARTS, devices, camera, controls };
</script>
