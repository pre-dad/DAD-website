name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Cheap static checks: generated files, e2e typecheck, shell scripts, PHP
  # syntax.
  # ---------------------------------------------------------------------------
  checks:
    name: Build, lint and type check
    runs-on: ubuntu-24.04
    # A hung step must fail the job.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Node 20 matches the e2e job and satisfies package.json engines (>=20).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generated files are up to date
        # Fails if css/site.css or the ?v= asset versions are stale.
        run: npm ci && npm run check
      - name: Type check the e2e specs
        working-directory: dad/tests-e2e
        run: npm ci && npm run typecheck
      - name: Shellcheck the deploy scripts
        # Preinstalled on ubuntu-24.04. Fail loudly if it is missing:
        # skipping would let broken deploy scripts pass unnoticed.
        run: |
          command -v shellcheck >/dev/null || { echo "shellcheck is not installed on this runner" >&2; exit 1; }
          shellcheck deploy.sh deploy/*.sh dad/tests-e2e/ci-setup-config.sh
      - name: Lint PHP
        working-directory: dad
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l > /dev/null
  # ---------------------------------------------------------------------------
  # Tier 1: PHP unit tests (existing PHPUnit suite). Must stay green.
  # ---------------------------------------------------------------------------
  php-tests:
    name: PHP unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dad
    steps:
      - uses: actions/checkout@v4

      # ubuntu-24.04 ships PHP 8.3 and Composer; fail early if a required
      # extension is missing.
      - name: Verify PHP extensions
        run: php -m | grep -ix -e pdo_sqlite -e sqlite3 -e mbstring | sort -u | wc -l | grep -qx 3
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - run: ./.phpunit-vendor/bin/phpunit

  # ---------------------------------------------------------------------------
  # Tier 3: Playwright E2E + axe a11y, then the Tier 2 smoke test, against a
  # php -S instance.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E + a11y (Playwright + axe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify PHP extensions
        run: php -m | grep -ix -e pdo_sqlite -e sqlite3 -e mbstring | sort -u | wc -l | grep -qx 3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E dependencies
        working-directory: dad/tests-e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: dad/tests-e2e
        run: npx playwright install --with-deps chromium

      - name: Write throwaway config
        working-directory: dad
        run: bash tests-e2e/ci-setup-config.sh --ci

      - name: Start PHP server and wait for health
        working-directory: dad
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8080 -t "$PWD" tests-e2e/router.php > "$RUNNER_TEMP/php-server.log" 2>&1 &
          echo "PHP_SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health.php | grep -q '"ok":true'; then
              echo "Server healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time; server log:" >&2
          cat "$RUNNER_TEMP/php-server.log" >&2 || true
          exit 1

      - name: Run Playwright E2E + a11y
        working-directory: dad/tests-e2e
        run: npx playwright test

      - name: Smoke test
        run: bash deploy/smoke-test.sh --base-url http://127.0.0.1:8080 --form

      - name: Stop PHP server
        if: always()
        run: kill "${PHP_SERVER_PID}" 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dad/tests-e2e/playwright-report/
          retention-days: 7
