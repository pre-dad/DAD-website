name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dad/tests-e2e/package-lock.json

      - name: Generated files are up to date
        run: npm ci && npm run check

      - name: Type check the e2e specs
        working-directory: dad/tests-e2e
        run: npm ci && npm run typecheck

      - name: Shellcheck the deploy scripts
        run: shellcheck deploy.sh deploy/*.sh dad/tests-e2e/ci-setup-config.sh

      - name: Lint PHP
        working-directory: dad
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l > /dev/null

  php-tests:
    name: PHP unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 8.4 is the boxes' Apache mod_php; 8.5 is their CLI, which serves the prod smoke test.
        php: ['8.4', '8.5']
    defaults:
      run:
        working-directory: dad
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none

      - name: Get composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('dad/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: ./.phpunit-vendor/bin/phpunit

  e2e:
    name: E2E + a11y (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dad/tests-e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: dad/tests-e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: dad/tests-e2e
        # No --with-deps: it runs apt-get, which has stalled for minutes on the hosted
        # runner, and the runner image already has Chromium's shared libraries.
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Write throwaway config
        working-directory: dad
        run: bash tests-e2e/ci-setup-config.sh --ci

      - name: Start PHP server and wait for health
        working-directory: dad
        run: |
          php -S 127.0.0.1:8080 -t "$PWD" tests-e2e/router.php > "$RUNNER_TEMP/php-server.log" 2>&1 &
          echo "PHP_SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health.php | grep -q '"ok":true'; then
              echo "Server healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time; server log:" >&2
          cat "$RUNNER_TEMP/php-server.log" >&2 || true
          exit 1

      - name: Run Playwright E2E + a11y
        working-directory: dad/tests-e2e
        run: npx playwright test

      - name: Smoke test
        run: bash deploy/smoke-test.sh --base-url http://127.0.0.1:8080 --form

      - name: Stop PHP server
        if: always()
        run: kill "${PHP_SERVER_PID}" 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dad/tests-e2e/playwright-report/
          retention-days: 7
