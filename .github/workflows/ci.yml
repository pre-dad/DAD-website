name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Tier 1: PHP unit tests (existing PHPUnit suite). Must stay green.
  # ---------------------------------------------------------------------------
  php-tests:
    name: PHP unit tests
    runs-on: [self-hosted, dad, linux]
    defaults:
      run:
        working-directory: dad
    steps:
      - uses: actions/checkout@v4

      # No shivammathur/setup-php: that action hangs on the self-hosted macOS
      # runner. The host provides PHP 8.3 with pdo_sqlite/sqlite3/mbstring and
      # Composer (see .github/SELF_HOSTED_RUNNERS.md). No composer cache either —
      # ~/.composer persists on the runner and the cache-save step can hang.
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: ./.phpunit-vendor/bin/phpunit

  # ---------------------------------------------------------------------------
  # Tier 3: Playwright E2E + axe a11y against a php -S instance.
  # ---------------------------------------------------------------------------
  e2e-a11y:
    name: E2E + a11y (Playwright + axe)
    runs-on: [self-hosted, dad, linux]
    steps:
      - uses: actions/checkout@v4

      # No shivammathur/setup-php — it hangs on the self-hosted macOS runner; the
      # host provides PHP 8.3 + extensions (see .github/SELF_HOSTED_RUNNERS.md).

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No cache: npm — on the persistent self-hosted runner ~/.npm survives
          # between runs, and the setup-node cache-save post-step can hang for
          # minutes and cancel the job at its timeout.

      - name: Install E2E dependencies
        working-directory: dad/tests-e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: dad/tests-e2e
        # No --with-deps: it runs apt-get (Linux only), and the self-hosted macOS
        # runner already has Chromium's shared libraries via the browser download.
        run: npx playwright install chromium

      - name: Write throwaway CI config
        working-directory: dad
        run: bash tests-e2e/ci-setup-config.sh --ci

      - name: Start PHP server and wait for health
        working-directory: dad
        run: |
          php -S 127.0.0.1:8080 -t "$PWD" tests-e2e/router.php \
            > "$RUNNER_TEMP/php-server.log" 2>&1 &
          echo "PHP_SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health.php | grep -q '"ok":true'; then
              echo "Server healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time; server log:" >&2
          cat "$RUNNER_TEMP/php-server.log" >&2 || true
          exit 1

      - name: Run Playwright E2E + a11y
        working-directory: dad/tests-e2e
        run: npx playwright test

      - name: Stop PHP server
        if: always()
        run: kill "${PHP_SERVER_PID}" 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dad/tests-e2e/playwright-report/
          retention-days: 7
